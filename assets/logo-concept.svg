<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1B2340"/>
      <stop offset="55%" stop-color="#0D1124"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF"/>
      <stop offset="45%" stop-color="#4AA8FF"/>
      <stop offset="100%" stop-color="#9D7BFF"/>
    </linearGradient>
    <linearGradient id="eclipseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B9AFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4AA8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#232B4D" stroke-width="2"/>
  <!-- orbit ring -->
  <ellipse cx="256" cy="256" rx="150" ry="150" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.95"/>
  <!-- eclipse shadow -->
  <circle cx="256" cy="256" r="118" fill="#05070F"/>
  <!-- moon disc offset for eclipse effect -->
  <circle cx="296" cy="226" r="108" fill="#0B1026"/>
  <circle cx="296" cy="226" r="108" fill="none" stroke="#2A3560" stroke-width="2" opacity="0.6"/>
  <!-- corona highlight -->
  <path d="M 118 256 A 138 138 0 0 1 394 256" fill="none" stroke="url(#eclipseGlow)" stroke-width="14" stroke-linecap="round" filter="url(#soft)"/>
  <!-- timeline play mark -->
  <polygon points="244,216 244,296 312,256" fill="#FFFFFF"/>
  <polygon points="244,216 244,296 312,256" fill="none" stroke="#7C6CFF" stroke-width="4" stroke-linejoin="round"/>
  <!-- small keyframe dots on orbit -->
  <circle cx="106" cy="256" r="10" fill="#4AA8FF"/>
  <circle cx="406" cy="256" r="10" fill="#7C6CFF"/>
  <circle cx="256" cy="106" r="8" fill="#9D7BFF"/>
</svg>
